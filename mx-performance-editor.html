<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MX Performance Editor</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--panel2:#252932;--line:#323845;--fg:#e8eaee;--mute:#8b93a3;--acc:#ff6a3d;--acc2:#3dd6ff;--ok:#4cd694;--bad:#ff5468;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not(.dark){--bg:#f3f4f7;--panel:#fff;--panel2:#eef0f4;--line:#d5d9e2;--fg:#1b1e25;--mute:#667085;--acc:#e24a1b;--acc2:#0a7ea8;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0 8px 0 0;letter-spacing:.5px}h1 b{color:var(--acc)}
select,input,button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.dng:hover{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.4;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}.dot.on{background:var(--ok)}
main{max-width:1100px;margin:0 auto;padding:16px}
#status{color:var(--mute);font-size:12px;margin-left:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
th{font-size:11px;text-transform:uppercase;color:var(--mute);background:var(--panel2)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel2)}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.tag.dev{color:var(--ok);border-color:var(--ok)}.tag.mod{color:var(--acc);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.parts{display:grid;gap:10px}
.part{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.part .n{font-weight:700;color:var(--acc2);font-size:18px;text-align:center}
.part .vn{font-size:16px;font-weight:600}.part .vs{color:var(--mute);font-size:12px}
.sl{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mute)}
.sl label{display:flex;gap:6px;align-items:center}.sl input[type=range]{width:90px;padding:0}.sl input[type=number]{width:62px;padding:2px 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.crumb{margin-bottom:10px;color:var(--mute)}.crumb a{color:var(--acc2);cursor:pointer}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0;width:min(760px,95vw);max-height:85vh}
dialog::backdrop{background:#0008}.dh{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.dl{overflow:auto;max-height:60vh}.dl div{padding:6px 12px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid var(--line)}
.dl div:hover{background:var(--panel2)}.dl .c{color:var(--mute);width:120px;flex:none;font-size:12px}
#log{font:11px ui-monospace,monospace;color:var(--mute);max-height:90px;overflow:auto;margin-top:12px}
.empty{color:var(--mute);padding:20px;text-align:center}
.warn{background:#ff54681a;border:1px solid var(--bad);padding:8px 12px;border-radius:8px;margin-bottom:12px}
</style></head><body>
<header>
 <h1>MX <b>Performance</b> Editor</h1>
 <span class="dot" id="dot"></span>
 <select id="mi" title="MIDI input"></select><select id="mo" title="MIDI output"></select>
 <label style="font-size:12px;color:var(--mute)">Dev# <input id="dev" type="number" min="1" max="16" value="1" style="width:56px"></label>
 <button id="conn" class="pri">Connect MIDI</button>
 <span id="status">Not connected</span>
</header>
<main id="app"></main>
<script>/* MX performance SysEx core — works in browser (global MXCore) and Node (module.exports). */
(function (root) {
  'use strict';
  const HDR = [0x43, 0x00, 0x7f, 0x17]; // 0x43, 0n (patched), model id
  const SIZES = { common: 0x50, rev: 0x26, cho: 0x28, eq: 0x14, arpc: 0x0e, part: 0x3e, arp: 0x48 };
  const OFF = { // part offsets
    msb: 1, lsb: 2, pc: 3, rch: 4, vlo: 6, vhi: 7, nlo: 8, nhi: 9, vol: 0x0e, pan: 0x0f,
    rev: 0x12, cho: 0x13, shift: 0x16
  };
  const CO = { name: 0, mode: 0x41, split: 0x42, link: 0x44, arpAK: 0x49, vol: 0x38, rev: 0x3b, cho: 0x3c };

  function checksum(arr) { let s = 0; for (const b of arr) s += b; return (128 - (s & 127)) & 127; }

  function msg(dev, addr, data) {
    const bc = data.length;
    const body = [bc >> 7 & 127, bc & 127, addr[0], addr[1], addr[2], ...data];
    return Uint8Array.from([0xf0, 0x43, dev & 15, 0x7f, 0x17, ...body, checksum(body), 0xf7]);
  }
  function requestMsg(dev, addr) {
    return Uint8Array.from([0xf0, 0x43, 0x20 | (dev & 15), 0x7f, 0x17, addr[0], addr[1], addr[2], 0xf7]);
  }
  // Parse one bulk dump message -> {addr:[h,m,l], data:Uint8Array} or null
  function parse(m) {
    if (m.length < 11 || m[0] !== 0xf0 || m[1] !== 0x43 || (m[2] & 0xf0) !== 0 || m[3] !== 0x7f || m[4] !== 0x17) return null;
    const bc = (m[5] << 7) | m[6];
    if (m.length !== 7 + 3 + bc + 2) return null;
    const body = Array.from(m.slice(5, 10 + bc));
    if (checksum(body) !== m[10 + bc]) return null;
    return { addr: [m[7], m[8], m[9]], data: m.slice(10, 10 + bc) };
  }

  function bytes(n, fill) { return new Uint8Array(n).fill(fill || 0); }
  function newPart(i) {
    const p = bytes(SIZES.part);
    Object.assign(p, { 1: 0x3f, 2: 0, 3: 0, 4: i, 5: 1, 6: 1, 7: 0x7f, 8: 0, 9: 0x7f, 0x0a: 0x42, 0x0b: 0x3e, 0x0c: 0x40, 0x0d: 0x40,
      0x0e: 0x64, 0x0f: 0x40, 0x10: 0x08, 0x12: 0x0c, 0x15: 0x7f, 0x16: 0x40, 0x18: 1, 0x1b: 0x40, 0x1c: 1, 0x1f: 0x7c, 0x20: 0x6f,
      0x21: 0x7f, 0x22: 1, 0x23: 0x40, 0x24: 0x40, 0x25: 0x40, 0x26: 0x40, 0x27: 0x40, 0x28: 0x40, 0x29: 0x40, 0x2a: 0x40, 0x2b: 0x40,
      0x2d: 0x40, 0x2e: 0x40, 0x3c: 0x40, 0x3d: 0x40 });
    return p;
  }
  function newArp(i) {
    const a = bytes(SIZES.arp);
    Object.assign(a, { 2: i, 6: 1, 7: 1, 8: 3, 0x0a: 0x7f, 0x0b: 1, 0x0c: 0x7f, 0x0f: 1, 0x10: 3, 0x13: 0x64 - 0, 0x15: 0x64 - 0, 0x1a: 1, 0x1c: 0x40,
      0x1d: 1, 0x1e: 0x40, 0x1f: 0x40, 0x21: 1, 0x22: 1, 0x23: 0x40 });
    a[0x12] = 0; a[0x13] = 0x64; a[0x14] = 0; a[0x15] = 0x64 - 0; // 100% as 14-bit pair (hi,lo)
    for (let k = 0; k < 6; k++) { a[0x24 + 4 * k] = 1; a[0x25 + 4 * k] = 0; a[0x26 + 4 * k] = 1; a[0x27 + 4 * k] = 0; }
    return a;
  }
  function setName(common, name) {
    const n = String(name).replace(/[^\x20-\x7e]/g, '?').padEnd(10, ' ').slice(0, 10);
    for (let i = 0; i < 10; i++) common[i] = n.charCodeAt(i);
  }
  function getName(common) { let s = ''; for (let i = 0; i < 10; i++) s += String.fromCharCode(common[i] >= 32 && common[i] < 127 ? common[i] : 32); return s.replace(/\s+$/, ''); }

  // Approximate defaults for effect blocks (Rev-X Hall / Chorus G-Chorus). Prefer a template from the device.
  function newPerformance(name, template) {
    const P = { common: bytes(SIZES.common), rev: bytes(SIZES.rev), cho: bytes(SIZES.cho), eq: bytes(SIZES.eq), arpc: bytes(SIZES.arpc), parts: [], arps: [] };
    for (let i = 0; i < 80; i++) P.common[i] = i < 10 ? 32 : 0;
    Object.assign(P.common, { 0x1f: 0x40, 0x21: 0x40, 0x22: 0x40, 0x23: 0x40, 0x24: 0x40, 0x2a: 0x40, 0x2b: 0x40, 0x2c: 0x40, 0x2d: 0x40, 0x38: 0x7f, 0x3b: 0x7f, 0x3c: 0x7f, 0x42: 0x48 });
    setName(P.common, name || 'Init Perf');
    P.rev[0] = 1; P.rev[1] = 0; P.rev[0x24] = 0x60 - 0; P.rev[0x25] = 0x60;
    P.cho[0] = 0x03; P.cho[1] = 0x10; P.cho[0x24] = 0x60; P.cho[0x25] = 0x40;
    const eqd = [0x40, 0x0c, 7, 0, 0x40, 0x14, 7, 1, 0x40, 0x1c, 7, 1, 0x40, 0x2c, 7, 1, 0x40, 0x34, 7, 0];
    // layout per table: lowgain,lowfreq,lowQ,lowshape,lmgain,lmfreq,lmQ,res,mgain,mfreq,mQ,res,hmgain,hmfreq,hmQ,res,hgain,hfreq,hQ,hshape
    const e = [0x40, 0x0c, 7, 0, 0x40, 0x14, 7, 1, 0x40, 0x1c, 7, 1, 0x40, 0x2c, 7, 1, 0x40, 0x34, 7, 0];
    e.forEach((v, i) => P.eq[i] = v);
    P.arpc[0x03] = 0x5a; P.arpc[2] = 0; P.arpc[3] = 0x5a; P.arpc[6] = 1; P.arpc[8] = 1; P.arpc[0x0a] = 1; P.arpc[0x0c] = 1;
    P.arpc[3] = 0x5a; P.arpc[2] = 0; // tempo 90
    for (let i = 0; i < 16; i++) { P.parts.push(newPart(i)); P.arps.push(newArp(i)); }
    if (template) for (const k of ['rev', 'cho', 'eq']) P[k] = Uint8Array.from(template[k]);
    P.parts.forEach(p => p[OFF.rch] = 0x7f);
    return P;
  }
  function clonePerf(P) {
    return { common: P.common.slice(), rev: P.rev.slice(), cho: P.cho.slice(), eq: P.eq.slice(), arpc: P.arpc.slice(),
      parts: P.parts.map(x => x.slice()), arps: P.arps.map(x => x.slice()) };
  }
  // Serialise to SysEx messages. target: nn (0..127 user perf slot) or 'edit'
  function build(dev, P, target) {
    const hm = target === 'edit' ? [0x5f, 0] : [0x50, target];
    const out = [msg(dev, [0x0e, hm[0], hm[1]], [])];
    out.push(msg(dev, [0x36, 0, 0], P.common), msg(dev, [0x36, 1, 0], P.rev), msg(dev, [0x36, 2, 0], P.cho),
      msg(dev, [0x36, 0x10, 0], P.eq), msg(dev, [0x36, 0x30, 0], P.arpc));
    P.parts.forEach((p, i) => out.push(msg(dev, [0x37, i, 0], p)));
    P.arps.forEach((a, i) => out.push(msg(dev, [0x38, i, 0], a)));
    out.push(msg(dev, [0x0f, hm[0], hm[1]], []));
    return out;
  }
  function requestFor(dev, target) { return requestMsg(dev, target === 'edit' ? [0x0e, 0x5f, 0] : [0x0e, 0x50, target]); }
  // Assemble messages into a performance (returns null until header..footer complete)
  function Assembler() {
    let P = null;
    this.feed = function (raw) {
      const m = parse(raw); if (!m) return null;
      const [h, mi, l] = m.addr;
      if (h === 0x0e) { P = newPerformance('', null); P._hdr = [mi, l]; P._seen = 0; return null; }
      if (!P) return null;
      const set = (a, d) => { if (d.length === a.length) { a.set(d); P._seen++; } };
      if (h === 0x36) { const k = { 0: 'common', 1: 'rev', 2: 'cho', 0x10: 'eq', 0x30: 'arpc' }[mi]; if (k) set(P[k], m.data); }
      else if (h === 0x37 && mi < 16) set(P.parts[mi], m.data);
      else if (h === 0x38 && mi < 16) set(P.arps[mi], m.data);
      else if (h === 0x0f) { const r = P; P = null; return r._seen >= 5 ? r : null; }
      return null;
    };
  }
  // Parse a .syx file (concatenated messages) -> array of performances
  function parseSyx(buf) {
    const A = new Assembler(), res = []; let s = -1;
    for (let i = 0; i < buf.length; i++) {
      if (buf[i] === 0xf0) s = i;
      else if (buf[i] === 0xf7 && s >= 0) { const r = A.feed(buf.slice(s, i + 1)); if (r) res.push(r); s = -1; }
    }
    return res;
  }

  // Part helpers
  const active = p => p[OFF.rch] !== 0x7f;
  function setVoice(p, v) { p[OFF.msb] = v.b; p[OFF.lsb] = v.l; p[OFF.pc] = v.p - 1; }
  function getVoiceKey(p) { return p[OFF.msb] + ':' + p[OFF.lsb] + ':' + (p[OFF.pc] + 1); }

  const noteName = n => noteNames[n % 12] + (Math.floor(n / 12) - 2);
  function addVoice(P, v) { // returns part index or -1 if all 16 used
    const i = P.parts.findIndex(p => !active(p)); if (i < 0) return -1;
    const p = P.parts[i]; p.set(newPart(i)); setVoice(p, v); return i;
  }
  function removeVoice(P, i) { P.parts[i][OFF.rch] = 0x7f; }

  root.MXCore = { SIZES, OFF, CO, checksum, msg, requestMsg, requestFor, parse, build, Assembler, parseSyx, newPerformance, clonePerf, newPart, newArp,
    setName, getName, active, setVoice, getVoiceKey, noteName, addVoice, removeVoice };
  if (typeof module !== 'undefined') module.exports = root.MXCore;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
'use strict';
const C=MXCore,$=s=>document.querySelector(s),OFF=C.OFF;
const slotName=i=>'ABCDEFGH'[i>>4]+String((i&15)+1).padStart(2,'0');
const vByKey=new Map(),vByName=new Map();
DATA.voices.forEach(v=>{vByKey.set(v.b+':'+v.l+':'+v.p,v);if(!vByName.has(v.n))vByName.set(v.n,v)});
const voiceOf=p=>vByKey.get(C.getVoiceKey(p));
const MODES=['single','layer','split'];
const NOTE=n=>C.noteName(n);
// ---- library: 128 slots {P, src:'list'|'dev'|'edit', dirty}
let lib=[];
function fromList(f,i){const P=C.newPerformance(f.name);P.common[CO_MODE]=MODES.indexOf(f.mode);
 const m=/^([A-G]#?)(-?\d)$/.exec(f.split);if(m){P.common[0x42]=(['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(m[1]))+(+m[2]+2)*12}
 [0,1,9].forEach((pi,k)=>{const v=vByName.get(f.v[k]);if(v){const p=P.parts[pi];p.set(C.newPart(pi));C.setVoice(p,v)}});
 P.arpc[4]=f.arp==='on'?1:0;P.common[0x49]=f.ak==='on'?1:0;return P}
const CO_MODE=0x41;
function loadLib(){let saved=null;try{saved=JSON.parse(localStorage.getItem('mxlib')||'null')}catch(e){}
 lib=DATA.perfs.map((f,i)=>{const s=saved&&saved[i];if(s){return{P:unpack(s.P),src:s.src,dirty:s.dirty}}return{P:fromList(f,i),src:'list',dirty:false}})}
const pack=P=>({common:[...P.common],rev:[...P.rev],cho:[...P.cho],eq:[...P.eq],arpc:[...P.arpc],parts:P.parts.map(x=>[...x]),arps:P.arps.map(x=>[...x])});
const unpack=o=>({common:Uint8Array.from(o.common),rev:Uint8Array.from(o.rev),cho:Uint8Array.from(o.cho),eq:Uint8Array.from(o.eq),arpc:Uint8Array.from(o.arpc),parts:o.parts.map(x=>Uint8Array.from(x)),arps:o.arps.map(x=>Uint8Array.from(x))});
function save(){try{localStorage.setItem('mxlib',JSON.stringify(lib.map(l=>({P:pack(l.P),src:l.src,dirty:l.dirty}))))}catch(e){}}
// ---- MIDI
let access=null,inp=null,out=null,asm=new C.Assembler(),waiter=null;
const dev=()=>Math.max(0,Math.min(15,(+$('#dev').value||1)-1));
function status(t){$('#status').textContent=t}
function log(t){const l=$('#log');if(l){l.textContent+=t+'\n';l.scrollTop=1e9}}
async function connect(){
 if(!navigator.requestMIDIAccess){status('Web MIDI not supported — use Chrome or Edge');return}
 try{access=await navigator.requestMIDIAccess({sysex:true})}catch(e){status('MIDI access denied: '+e.message);return}
 access.onstatechange=fillPorts;fillPorts();}
function fillPorts(){
 const f=(sel,map,pref)=>{const cur=sel.value;sel.innerHTML='<option value="">— none —</option>'+[...map.values()].map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  const m=[...map.values()].find(p=>/mx/i.test(p.name));sel.value=cur&&map.get(cur)?cur:(m?m.id:'')};
 f($('#mi'),access.inputs);f($('#mo'),access.outputs);bindPorts()}
function bindPorts(){
 if(inp)inp.onmidimessage=null;inp=access.inputs.get($('#mi').value)||null;out=access.outputs.get($('#mo').value)||null;
 if(inp){inp.onmidimessage=onMsg}
 $('#dot').classList.toggle('on',!!(inp&&out));status(inp&&out?`Connected: ${out.name}`:'Select MIDI in/out ports');render()}
function onMsg(e){const d=e.data;if(d[0]!==0xf0)return;const r=asm.feed(d);if(r&&waiter)waiter(r)}
function send(m){if(!out)throw new Error('No MIDI output selected');out.send(m)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function request(target,timeout=1500){return new Promise((res,rej)=>{asm=new C.Assembler();const t=setTimeout(()=>{waiter=null;rej(new Error('timeout'))},timeout);
 waiter=r=>{clearTimeout(t);waiter=null;res(r)};send(C.requestFor(dev(),target))})}
async function sendPerf(P,target){const ms=C.build(dev(),P,target);for(const m of ms){send(m);await sleep(12)}}
async function readSlot(i){const P=await request(i);lib[i]={P,src:'dev',dirty:false};save()}
async function readAll(){let ok=0;for(let i=0;i<128;i++){try{status(`Reading ${slotName(i)} (${i+1}/128)…`);await readSlot(i);ok++;if(view.type==='list')renderList()}catch(e){log('read '+slotName(i)+' failed: '+e.message);if(!ok&&i>=2){status('No response from keyboard — check ports, Device# and that USB MIDI is on');return}}}
 status(`Read ${ok}/128 performances`);render()}
async function writeSlot(i){if(!confirm(`Overwrite performance ${slotName(i)} on the keyboard?\n(Bulk Protect must be OFF on the instrument.)`))return;
 status('Writing '+slotName(i)+'…');await sendPerf(lib[i].P,i);lib[i].dirty=false;lib[i].src='dev';save();status('Wrote '+slotName(i));render()}
async function audition(i){status('Sending to edit buffer…');await sendPerf(lib[i].P,'edit');status('Sent to the edit buffer — play the keyboard (performance mode)')}
function note(on){if(!out)return;const ch=0;out.send(on?[0x90|ch,60,100]:[0x80|ch,60,0])}
// ---- views
let view={type:'list'};
function go(v){view=v;render();scrollTo(0,0)}
function render(){view.type==='list'?renderList():renderDetail()}
function modLabel(l){return l.dirty?'<span class="tag mod">modified</span>':l.src==='dev'?'<span class="tag dev">from keyboard</span>':'<span class="tag">factory list</span>'}
function vnames(P){return P.parts.map((p,i)=>C.active(p)?(voiceOf(p)?.n||`${p.slice(1,4).join('/')}`):null).filter(Boolean)}
function renderList(){const q=(view.q||'').toLowerCase();
 let h=`<div class="bar"><input id="q" placeholder="Search name or voice…" value="${view.q||''}" style="flex:1;min-width:200px">
 <button id="rall" ${out?'':'disabled'}>Read all from keyboard</button><button id="imp">Import .syx</button><button id="expall">Export all .syx</button><button id="rst" class="dng">Reset library</button></div>
 <div class="warn" ${out?'hidden':''}>Not connected. You can browse and edit the factory list offline; connect to read, audition and write your real performances.</div>
 <table><thead><tr><th>Slot</th><th>Name</th><th>Mode</th><th>Voices</th><th>#</th><th>Source</th></tr></thead><tbody>`;
 lib.forEach((l,i)=>{const names=vnames(l.P);const nm=C.getName(l.P.common);
  if(q&&!(nm+' '+names.join(' ')+slotName(i)).toLowerCase().includes(q))return;
  h+=`<tr class="row" data-i="${i}"><td>${slotName(i)}</td><td><b>${esc(nm)}</b></td><td>${MODES[l.P.common[CO_MODE]]||'?'}</td><td title="${esc(names.join(', '))}">${esc(names.join(' · '))}</td><td>${names.length}</td><td>${modLabel(l)}</td></tr>`});
 h+=`</tbody></table><pre id="log"></pre><input type="file" id="file" accept=".syx" hidden>`;
 $('#app').innerHTML=h;const qi=$('#q');qi.oninput=()=>{view.q=qi.value;const p=qi.selectionStart;renderList();$('#q').focus();$('#q').setSelectionRange(p,p)};
 document.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>go({type:'detail',i:+r.dataset.i}));
 $('#rall').onclick=readAll;$('#rst').onclick=()=>{if(confirm('Discard local edits and reload the factory list?')){localStorage.removeItem('mxlib');loadLib();render()}};
 $('#imp').onclick=()=>$('#file').click();
 $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const L=C.parseSyx(new Uint8Array(await f.arrayBuffer()));if(!L.length){alert('No performances found in that file');return}
  const start=+(prompt(`${L.length} performance(s) found. Import into slot number (1-128), starting at:`,'1')||0);if(!start)return;
  L.forEach((P,k)=>{const i=start-1+k;if(i<128){lib[i]={P,src:'dev',dirty:true}}});save();render()};
 $('#expall').onclick=()=>download('mx-performances.syx',lib.flatMap(l=>C.build(dev(),l.P,lib.indexOf(l))))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function download(name,msgs){const b=new Blob(msgs,{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function touch(i){lib[i].dirty=true;save()}
function renderDetail(){const i=view.i,l=lib[i],P=l.P,c=P.common;
 const act=P.parts.map((p,k)=>C.active(p)?k:-1).filter(k=>k>=0);
 let h=`<div class="crumb"><a id="back">All performances</a> › ${slotName(i)} ${modLabel(l)}</div>
 <div class="bar"><button id="pr" ${i>0?'':'disabled'}>◀</button><button id="nx" ${i<127?'':'disabled'}>▶</button>
 <button id="aud" class="pri" ${out?'':'disabled'}>Audition (send to edit buffer)</button><button id="wr" ${out?'':'disabled'}>Write to ${slotName(i)}</button>
 <button id="rd" ${out?'':'disabled'}>Re-read from keyboard</button><button id="tn" ${out?'':'disabled'}>Test note</button>
 <button id="exp">Export .syx</button><button id="dup">Copy to…</button><button id="clr" class="dng">Clear performance</button></div>
 <div class="card"><div class="grid2">
 <label>Name<input id="nm" maxlength="10" value="${esc(C.getName(c))}"></label>
 <label>Keyboard mode<select id="md">${MODES.map((m,k)=>`<option value="${k}" ${c[CO_MODE]==k?'selected':''}>${m}</option>`).join('')}</select></label>
 <label>Split point (note ${NOTE(c[0x42])})<input id="sp" type="number" min="1" max="127" value="${c[0x42]}"></label>
 <label>Performance volume<input id="pv" type="range" min="0" max="127" value="${c[0x38]}"></label>
 <label>Arpeggio<select id="ar"><option value="0" ${P.arpc[4]?'':'selected'}>off</option><option value="1" ${P.arpc[4]?'selected':''}>on</option></select></label>
 <label>Tempo<input id="tp" type="number" min="5" max="300" value="${(P.arpc[2]<<7)|P.arpc[3]}"></label></div></div>
 <div class="bar"><b>Voices (${act.length}/16)</b><button id="add" class="pri" ${act.length>=16?'disabled':''}>＋ Add voice</button></div><div class="parts">`;
 if(!act.length)h+='<div class="empty">No voices in this performance. Add one.</div>';
 act.forEach(k=>{const p=P.parts[k],v=voiceOf(p);
  h+=`<div class="part" data-k="${k}"><div class="n">${k+1}</div><div><div class="vn">${esc(v?v.n:'Unknown voice '+p[1]+'/'+p[2]+'/'+(p[3]+1))}</div>
  <div class="vs">${v?`${v.m} › ${v.s} · `:''}MSB ${p[1]} LSB ${p[2]} PC ${p[3]+1}</div>
  <div class="sl"><label>Vol <input type="range" data-f="14" min="0" max="127" value="${p[14]}"></label><label>Pan <input type="range" data-f="15" min="1" max="127" value="${p[15]}"></label>
  <label>Rev <input type="range" data-f="18" min="0" max="127" value="${p[18]}"></label><label>Cho <input type="range" data-f="19" min="0" max="127" value="${p[19]}"></label>
  <label>Note ≥ <input type="number" data-f="8" min="0" max="127" value="${p[8]}" title="${NOTE(p[8])}"></label><label>≤ <input type="number" data-f="9" min="0" max="127" value="${p[9]}" title="${NOTE(p[9])}"></label>
  <label>Shift <input type="number" data-f="22" min="40" max="88" value="${p[22]}" title="64 = 0"></label><label>Ch <input type="number" data-f="4" min="0" max="15" value="${p[4]}" title="0-based receive channel"></label></div></div>
  <div style="display:flex;gap:6px;flex-direction:column"><button class="chg">Change voice</button><button class="rm dng">Remove</button></div></div>`});
 h+=`</div><pre id="log"></pre>
 <dialog id="dlg"><div class="dh"><input id="vq" placeholder="Search voices…" style="flex:1"><select id="vc"><option value="">All categories</option>${[...new Set(DATA.voices.map(v=>v.m))].map(m=>`<option>${m}</option>`).join('')}</select><button id="vx">Close</button></div><div class="dl" id="vl"></div></dialog><input type="file" id="file" accept=".syx" hidden>`;
 $('#app').innerHTML=h;
 $('#back').onclick=()=>go({type:'list'});$('#pr').onclick=()=>go({type:'detail',i:i-1});$('#nx').onclick=()=>go({type:'detail',i:i+1});
 $('#nm').oninput=e=>{C.setName(c,e.target.value);touch(i)};
 $('#md').onchange=e=>{c[CO_MODE]=+e.target.value;touch(i)};$('#sp').oninput=e=>{c[0x42]=Math.max(1,Math.min(127,+e.target.value||1));touch(i)};
 $('#pv').oninput=e=>{c[0x38]=+e.target.value;touch(i)};$('#ar').onchange=e=>{P.arpc[4]=+e.target.value;touch(i)};
 $('#tp').onchange=e=>{const t=Math.max(5,Math.min(300,+e.target.value||90));P.arpc[2]=t>>7;P.arpc[3]=t&127;touch(i)};
 document.querySelectorAll('.part').forEach(el=>{const k=+el.dataset.k;
  el.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=()=>{P.parts[k][+inp.dataset.f]=+inp.value;touch(i)});
  el.querySelector('.rm').onclick=()=>{C.removeVoice(P,k);touch(i);renderDetail()};
  el.querySelector('.chg').onclick=()=>pick(v=>{C.setVoice(P.parts[k],v);touch(i);renderDetail()})});
 $('#add').onclick=()=>pick(v=>{const k=C.addVoice(P,v);if(k<0)return alert('All 16 parts are in use');
  if(c[CO_MODE]===2&&act.length===1)P.parts[k][OFF.nlo]=c[0x42];touch(i);renderDetail()});
 $('#aud').onclick=()=>audition(i).catch(e=>status(e.message));$('#wr').onclick=()=>writeSlot(i).catch(e=>status(e.message));
 $('#rd').onclick=()=>readSlot(i).then(renderDetail).catch(e=>status('Read failed: '+e.message));
 $('#tn').onclick=()=>{note(1);setTimeout(()=>note(0),600)};
 $('#exp').onclick=()=>download(`${slotName(i)}-${C.getName(c).trim()||'perf'}.syx`,C.build(dev(),P,i));
 $('#dup').onclick=()=>{const t=+(prompt('Copy to slot number (1-128):',String(i+2))||0);if(t>=1&&t<=128){lib[t-1]={P:C.clonePerf(P),src:'dev',dirty:true};save();go({type:'detail',i:t-1})}};
 $('#clr').onclick=()=>{if(confirm('Remove all voices and reset this performance?')){const old=P;lib[i]={P:C.newPerformance('Init Perf',old),src:'dev',dirty:true};save();renderDetail()}}}
function pick(cb){const d=$('#dlg'),q=$('#vq'),cat=$('#vc'),L=$('#vl');
 const draw=()=>{const s=q.value.toLowerCase(),m=cat.value;const r=DATA.voices.filter(v=>(!m||v.m===m)&&(!s||(v.n+' '+v.s+' '+v.m).toLowerCase().includes(s))).slice(0,300);
  L.innerHTML=r.map(v=>`<div data-k="${v.b}:${v.l}:${v.p}"><span class="c">${v.m} › ${esc(v.s)}</span><b>${esc(v.n)}</b><span style="margin-left:auto;color:var(--mute)">${v.b}/${v.l}/${v.p}</span></div>`).join('')||'<div>No matches</div>';
  L.querySelectorAll('div[data-k]').forEach(e=>e.onclick=()=>{d.close();cb(vByKey.get(e.dataset.k))})};
 q.oninput=draw;cat.onchange=draw;$('#vx').onclick=()=>d.close();draw();d.showModal();q.focus()}
$('#conn').onclick=connect;$('#mi').onchange=$('#mo').onchange=()=>access&&bindPorts();
loadLib();render();
if(location.protocol==='http:'&&!/localhost|127\.0\.0\.1/.test(location.hostname))status('Web MIDI needs https or localhost');
</script></body></html>
