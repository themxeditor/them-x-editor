<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MX Performance Editor</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--panel2:#252932;--line:#323845;--fg:#e8eaee;--mute:#8b93a3;--acc:#ff6a3d;--acc2:#3dd6ff;--ok:#4cd694;--bad:#ff5468;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not(.dark){--bg:#f3f4f7;--panel:#fff;--panel2:#eef0f4;--line:#d5d9e2;--fg:#1b1e25;--mute:#667085;--acc:#e24a1b;--acc2:#0a7ea8;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0 8px 0 0;letter-spacing:.5px}h1 b{color:var(--acc)}
select,input,button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.dng:hover{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.4;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}.dot.on{background:var(--ok)}
main{max-width:1100px;margin:0 auto;padding:16px}
#status{color:var(--mute);font-size:12px;margin-left:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
th{font-size:11px;text-transform:uppercase;color:var(--mute);background:var(--panel2)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel2)}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.tag.dev{color:var(--ok);border-color:var(--ok)}.tag.mod{color:var(--acc);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.parts{display:grid;gap:10px}
.part{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.part .n{font-weight:700;color:var(--acc2);font-size:18px;text-align:center}
.part .vn{font-size:16px;font-weight:600}.part .vs{color:var(--mute);font-size:12px}
.sl{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mute)}
.sl label{display:flex;gap:6px;align-items:center}.sl input[type=range]{width:90px;padding:0}.sl input[type=number]{width:62px;padding:2px 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.crumb{margin-bottom:10px;color:var(--mute)}.crumb a{color:var(--acc2);cursor:pointer}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0;width:min(760px,95vw);max-height:85vh}
dialog::backdrop{background:#0008}.dh{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.dl{overflow:auto;max-height:60vh}.dl div{padding:6px 12px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid var(--line)}
.dl div:hover{background:var(--panel2)}.dl .c{color:var(--mute);width:120px;flex:none;font-size:12px}
#log{font:11px ui-monospace,monospace;color:var(--mute);max-height:90px;overflow:auto;margin-top:12px}
.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--mute)}
.tabs button.on{color:var(--fg);border-color:var(--acc);font-weight:600}.tabs button.off{opacity:.5}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:9px 12px;font-weight:600;list-style:none}details.sec>summary::before{content:'▸ ';color:var(--acc)}details.sec[open]>summary::before{content:'▾ '}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;padding:4px 12px 12px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:12px}
.pr .pn{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr .pv{font-variant-numeric:tabular-nums;text-align:right;min-width:60px}
.pr input[type=range]{grid-column:1/3;width:100%;padding:0}.pr select{grid-column:1/3}
.fxh{display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}.fxh select{min-width:220px}
.hint{color:var(--mute);font-size:12px;padding:0 12px 8px}
dialog.big{width:min(1000px,96vw);max-height:92vh}.big .body{padding:12px;overflow:auto;max-height:72vh}
.dl .ed{margin-left:8px;font-size:12px;padding:2px 8px}
.empty{color:var(--mute);padding:20px;text-align:center}
.warn{background:#ff54681a;border:1px solid var(--bad);padding:8px 12px;border-radius:8px;margin-bottom:12px}
</style></head><body>
<header>
 <h1>MX <b>Performance</b> Editor</h1>
 <span class="dot" id="dot"></span>
 <select id="mi" title="MIDI input"></select><select id="mo" title="MIDI output"></select>
 <label style="font-size:12px;color:var(--mute)">Dev# <input id="dev" type="number" min="1" max="16" value="1" style="width:56px"></label>
 <label style="font-size:12px;color:var(--mute);display:flex;gap:4px;align-items:center" title="When on, selecting a performance here also switches the keyboard to it"><input id="follow" type="checkbox" checked style="width:auto"> Follow</label>
 <label style="font-size:12px;color:var(--mute)">Ch <input id="fch" type="number" min="1" max="16" value="1" style="width:52px" title="MIDI channel the keyboard receives program changes on"></label>
 <label style="font-size:12px;color:var(--mute)" title="How long the keyboard pauses between the SysEx messages it sends. Lower is much faster. Stored in the keyboard (Utility: Bulk Dump Interval)">Bulk interval <select id="bulk" disabled style="padding:4px 6px"></select></label>
 <button id="conn" class="pri">Connect MIDI</button><button id="about" title="About this editor">About</button>
 <span id="status">Not connected</span>
</header>
<main id="app"></main>
<script>/* MX performance SysEx core — works in browser (global MXCore) and Node (module.exports). */
(function (root) {
  'use strict';
  const HDR = [0x43, 0x00, 0x7f, 0x17]; // 0x43, 0n (patched), model id
  const SIZES = { common: 0x50, rev: 0x26, cho: 0x28, eq: 0x14, arpc: 0x0e, part: 0x3e, arp: 0x48 };
  const OFF = { // part offsets
    msb: 1, lsb: 2, pc: 3, rch: 4, vlo: 6, vhi: 7, nlo: 8, nhi: 9, vol: 0x0e, pan: 0x0f,
    rev: 0x12, cho: 0x13, shift: 0x16
  };
  const CO = { name: 0, mode: 0x41, split: 0x42, link: 0x44, arpAK: 0x49, vol: 0x38, rev: 0x3b, cho: 0x3c };

  function checksum(arr) { let s = 0; for (const b of arr) s += b; return (128 - (s & 127)) & 127; }

  function msg(dev, addr, data) {
    const bc = data.length;
    const body = [bc >> 7 & 127, bc & 127, addr[0], addr[1], addr[2], ...data];
    return Uint8Array.from([0xf0, 0x43, dev & 15, 0x7f, 0x17, ...body, checksum(body), 0xf7]);
  }
  function requestMsg(dev, addr) {
    return Uint8Array.from([0xf0, 0x43, 0x20 | (dev & 15), 0x7f, 0x17, addr[0], addr[1], addr[2], 0xf7]);
  }
  // Parse one bulk dump message -> {addr:[h,m,l], data:Uint8Array} or null
  function parse(m) {
    if (m.length < 11 || m[0] !== 0xf0 || m[1] !== 0x43 || (m[2] & 0xf0) !== 0 || m[3] !== 0x7f || m[4] !== 0x17) return null;
    const bc = (m[5] << 7) | m[6];
    if (m.length !== 7 + 3 + bc + 2) return null;
    const body = Array.from(m.slice(5, 10 + bc));
    if (checksum(body) !== m[10 + bc]) return null;
    return { addr: [m[7], m[8], m[9]], data: m.slice(10, 10 + bc) };
  }

  function bytes(n, fill) { return new Uint8Array(n).fill(fill || 0); }
  function newPart(i) {
    const p = bytes(SIZES.part);
    Object.assign(p, { 1: 0x3f, 2: 0, 3: 0, 4: i, 5: 1, 6: 1, 7: 0x7f, 8: 0, 9: 0x7f, 0x0a: 0x42, 0x0b: 0x3e, 0x0c: 0x40, 0x0d: 0x40,
      0x0e: 0x64, 0x0f: 0x40, 0x10: 0x08, 0x12: 0x0c, 0x15: 0x7f, 0x16: 0x40, 0x18: 1, 0x1b: 0x40, 0x1c: 1, 0x1f: 0x7c, 0x20: 0x6f,
      0x21: 0x7f, 0x22: 1, 0x23: 0x40, 0x24: 0x40, 0x25: 0x40, 0x26: 0x40, 0x27: 0x40, 0x28: 0x40, 0x29: 0x40, 0x2a: 0x40, 0x2b: 0x40,
      0x2d: 0x40, 0x2e: 0x40, 0x3c: 0x40, 0x3d: 0x40 });
    return p;
  }
  function newArp(i) {
    const a = bytes(SIZES.arp);
    Object.assign(a, { 2: i, 6: 1, 7: 1, 8: 3, 0x0a: 0x7f, 0x0b: 1, 0x0c: 0x7f, 0x0f: 1, 0x10: 3, 0x13: 0x64 - 0, 0x15: 0x64 - 0, 0x1a: 1, 0x1c: 0x40,
      0x1d: 1, 0x1e: 0x40, 0x1f: 0x40, 0x21: 1, 0x22: 1, 0x23: 0x40 });
    a[0x12] = 0; a[0x13] = 0x64; a[0x14] = 0; a[0x15] = 0x64 - 0; // 100% as 14-bit pair (hi,lo)
    for (let k = 0; k < 6; k++) { a[0x24 + 4 * k] = 1; a[0x25 + 4 * k] = 0; a[0x26 + 4 * k] = 1; a[0x27 + 4 * k] = 0; }
    return a;
  }
  function setName(common, name) {
    const n = String(name).replace(/[^\x20-\x7e]/g, '?').padEnd(10, ' ').slice(0, 10);
    for (let i = 0; i < 10; i++) common[i] = n.charCodeAt(i);
  }
  function getName(common) { let s = ''; for (let i = 0; i < 10; i++) s += String.fromCharCode(common[i] >= 32 && common[i] < 127 ? common[i] : 32); return s.replace(/\s+$/, ''); }

  // Approximate defaults for effect blocks (Rev-X Hall / Chorus G-Chorus). Prefer a template from the device.
  function newPerformance(name, template) {
    const P = { common: bytes(SIZES.common), rev: bytes(SIZES.rev), cho: bytes(SIZES.cho), eq: bytes(SIZES.eq), arpc: bytes(SIZES.arpc), parts: [], arps: [] };
    for (let i = 0; i < 80; i++) P.common[i] = i < 10 ? 32 : 0;
    Object.assign(P.common, { 0x1f: 0x40, 0x21: 0x40, 0x22: 0x40, 0x23: 0x40, 0x24: 0x40, 0x2a: 0x40, 0x2b: 0x40, 0x2c: 0x40, 0x2d: 0x40, 0x38: 0x7f, 0x3b: 0x7f, 0x3c: 0x7f, 0x42: 0x48 });
    setName(P.common, name || 'Init Perf');
    P.rev[0] = 1; P.rev[1] = 0; P.rev[0x24] = 0x60; P.rev[0x25] = 0x40;
    P.cho[0] = 0x03; P.cho[1] = 0x10; P.cho[0x24] = 0x60; P.cho[0x25] = 0x40;
    const eqd = [0x40, 0x0c, 7, 0, 0x40, 0x14, 7, 1, 0x40, 0x1c, 7, 1, 0x40, 0x2c, 7, 1, 0x40, 0x34, 7, 0];
    // layout per table: lowgain,lowfreq,lowQ,lowshape,lmgain,lmfreq,lmQ,res,mgain,mfreq,mQ,res,hmgain,hmfreq,hmQ,res,hgain,hfreq,hQ,hshape
    const e = [0x40, 0x0c, 7, 0, 0x40, 0x14, 7, 1, 0x40, 0x1c, 7, 1, 0x40, 0x2c, 7, 1, 0x40, 0x34, 7, 0];
    e.forEach((v, i) => P.eq[i] = v);
    P.arpc[0x03] = 0x5a; P.arpc[2] = 0; P.arpc[3] = 0x5a; P.arpc[6] = 1; P.arpc[8] = 1; P.arpc[0x0a] = 1; P.arpc[0x0c] = 1;
    P.arpc[3] = 0x5a; P.arpc[2] = 0; // tempo 90
    for (let i = 0; i < 16; i++) { P.parts.push(newPart(i)); P.arps.push(newArp(i)); }
    if (template) for (const k of ['rev', 'cho', 'eq']) P[k] = Uint8Array.from(template[k]);
    P.parts.forEach(p => p[OFF.rch] = 0x7f);
    return P;
  }
  function clonePerf(P) {
    return { common: P.common.slice(), rev: P.rev.slice(), cho: P.cho.slice(), eq: P.eq.slice(), arpc: P.arpc.slice(),
      parts: P.parts.map(x => x.slice()), arps: P.arps.map(x => x.slice()) };
  }
  // Serialise to SysEx messages. target: nn (0..127 user perf slot) or 'edit'
  function build(dev, P, target) {
    const hm = target === 'edit' ? [0x5f, 0] : [0x50, target];
    const out = [msg(dev, [0x0e, hm[0], hm[1]], [])];
    out.push(msg(dev, [0x36, 0, 0], P.common), msg(dev, [0x36, 1, 0], P.rev), msg(dev, [0x36, 2, 0], P.cho),
      msg(dev, [0x36, 0x10, 0], P.eq), msg(dev, [0x36, 0x30, 0], P.arpc));
    P.parts.forEach((p, i) => out.push(msg(dev, [0x37, i, 0], p)));
    P.arps.forEach((a, i) => out.push(msg(dev, [0x38, i, 0], a)));
    out.push(msg(dev, [0x0f, hm[0], hm[1]], []));
    return out;
  }
  function requestFor(dev, target) { return requestMsg(dev, target === 'edit' ? [0x0e, 0x5f, 0] : [0x0e, 0x50, target]); }
  // Assemble messages into a performance (returns null until header..footer complete)
  function Assembler() {
    let P = null;
    this.feed = function (raw) {
      const m = parse(raw); if (!m) return null;
      const [h, mi, l] = m.addr;
      if (h === 0x0e) { P = newPerformance('', null); P._hdr = [mi, l]; P._seen = 0; return null; }
      if (!P) return null;
      const set = (a, d) => { if (d.length === a.length) { a.set(d); P._seen++; } };
      if (h === 0x36) { const k = { 0: 'common', 1: 'rev', 2: 'cho', 0x10: 'eq', 0x30: 'arpc' }[mi]; if (k) set(P[k], m.data); }
      else if (h === 0x37 && mi < 16) set(P.parts[mi], m.data);
      else if (h === 0x38 && mi < 16) set(P.arps[mi], m.data);
      else if (h === 0x0f) { const r = P; P = null; return r._seen >= 5 ? r : null; }
      return null;
    };
  }
  // Parse a .syx file (concatenated messages) -> array of performances
  function parseSyx(buf) {
    const A = new Assembler(), res = []; let s = -1;
    for (let i = 0; i < buf.length; i++) {
      if (buf[i] === 0xf0) s = i;
      else if (buf[i] === 0xf7 && s >= 0) { const r = A.feed(buf.slice(s, i + 1)); if (r) res.push(r); s = -1; }
    }
    return res;
  }

  // Parse a .syx file holding performances and/or voices. Slots come from the bulk headers.
  function parseSyxAll(buf) {
    const A = new Assembler(), VA = new VoiceAssembler(), res = { perfs: [], voices: [], skipped: 0 }; let s = -1;
    for (let i = 0; i < buf.length; i++) {
      if (buf[i] === 0xf0) s = i;
      else if (buf[i] === 0xf7 && s >= 0) {
        const m = buf.slice(s, i + 1); s = -1;
        const P = A.feed(m); if (P) res.perfs.push({ slot: P._hdr[0] === 0x50 ? P._hdr[1] : -1, P });
        const V = VA.feed(m); if (V) { if (V.hdr[0] === 0x0a) res.voices.push({ slot: V.hdr[1], V }); else res.skipped++; }
      }
    }
    return res;
  }

  // Part helpers
  const active = p => p[OFF.rch] !== 0x7f;
  function setVoice(p, v) { p[OFF.msb] = v.b; p[OFF.lsb] = v.l; p[OFF.pc] = v.p - 1; }
  function getVoiceKey(p) { return p[OFF.msb] + ':' + p[OFF.lsb] + ':' + (p[OFF.pc] + 1); }
  const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const noteName = n => noteNames[n % 12] + (Math.floor(n / 12) - 2);
  function addVoice(P, v) { // returns part index or -1 if all 16 used
    const i = P.parts.findIndex(p => !active(p)); if (i < 0) return -1;
    const p = P.parts[i]; p.set(newPart(i)); setVoice(p, v); return i;
  }
  function removeVoice(P, i) { P.parts[i][OFF.rch] = 0x7f; }


  // ---------- Effects (reverb / chorus / insertion share the same param layout: type(2) preset(1) rsv(1) params 16x2 @4) ----------
  const fxGet = (blk, i) => (blk[4 + 2 * i] << 7) | blk[5 + 2 * i];
  const fxSet = (blk, i, v) => { v = Math.max(0, Math.min(16383, v | 0)); blk[4 + 2 * i] = v >> 7; blk[5 + 2 * i] = v & 127; };
  const fxType = blk => [blk[0], blk[1]];
  // Neutral starting values when switching type (exact factory presets are not in the Data List)
  function fxDefaults(type) {
    const out = [];
    for (const p of type[6]) {
      let v = Math.round((p[3] + p[4]) / 2); const n = p[1];
      if (/Dry\/Wet|Balance/.test(n)) v = 64;
      else if (/Feedback Level|Lag|Pan Direction/.test(n) && p[3] === 1) v = 64;
      else if (/Gain/.test(n) && p[3] === 52) v = 64;
      else if (/Width|\bQ\b/.test(n) && p[4] === 120) v = 7;
      out.push([p[0] - 1, v]);
    }
    return out;
  }
  function setFxType(blk, type) {
    blk[0] = type[1]; blk[1] = type[2]; blk[2] = 0;
    for (let i = 0; i < 16; i++) fxSet(blk, i, 0);
    for (const [i, v] of fxDefaults(type)) fxSet(blk, i, v);
  }
  // ---------- Voices (normal voice bulk) ----------
  function voiceAddr(v) {
    const b = v.b, l = v.l, p = v.p - 1;
    if (b === 63 && l <= 7) return [0x0e, l, p];
    if (b === 63 && l === 8) return [0x0e, 0x0a, p];
    if (b === 0) return [0x0e, 0x09, p];
    return null; // drum kits and others: not editable
  }
  const VOICE_BLOCKS = [[0x40, 0, 0, 80], [0x40, 3, 0, 36], [0x40, 6, 0, 60], [0x40, 0x30, 0, 86]]
    .concat([...Array(8).keys()].map(e => [0x41, e, 0, 88]), [...Array(8).keys()].map(e => [0x42, e, 0, 74]));
  const vkey = (h, m) => h + ':' + m;
  function VoiceAssembler() {
    let V = null;
    this.feed = function (raw) {
      const m = parse(raw); if (!m) return null;
      const [h, mi, l] = m.addr;
      if (h === 0x0e) { V = { hdr: [mi, l], blocks: {} }; return null; }
      if (!V) return null;
      if (h === 0x0f) { const r = V; V = null; return r.blocks[vkey(0x40, 0)] ? r : null; }
      V.blocks[vkey(h, mi)] = Uint8Array.from(m.data); return null;
    };
  }
  function buildVoice(dev, V, target) { // target: [0x0e, mid, nn]
    const out = [msg(dev, target, [])];
    for (const [h, m, l] of VOICE_BLOCKS) { const d = V.blocks[vkey(h, m)]; if (d) out.push(msg(dev, [h, m, l], d)); }
    out.push(msg(dev, [0x0f, target[1], target[2]], []));
    return out;
  }
  const voiceName = V => { let s = ''; const c = V.blocks[vkey(0x40, 0)]; for (let i = 0; i < 10; i++) s += String.fromCharCode(c[i] >= 32 && c[i] < 127 ? c[i] : 32); return s.replace(/\s+$/, ''); };
  const setVoiceName = (V, name) => { const c = V.blocks[vkey(0x40, 0)], n = String(name).replace(/[^\x20-\x7e]/g, '?').padEnd(10, ' '); for (let i = 0; i < 10; i++) c[i] = n.charCodeAt(i); };
  const cloneVoice = V => ({ hdr: V.hdr.slice(), blocks: Object.fromEntries(Object.entries(V.blocks).map(([k, v]) => [k, v.slice()])) });
  // Generic spec-driven parameter access: spec {o,s,lo,hi}

 $('#aud').onclick=()=>audition(i).catch(e=>status(e.message));$('#wr').onclick=()=>writeSlot(i).catch(e=>status(e.message));

 $('#exp').onclick=()=>download(`${slotName(i)}-${C.getName(c).trim()||'perf'}.syx`,C.build(dev(),P,i));
 $('#dup').onclick=()=>{const t=+(prompt('Copy to slot number (1-128):',String(i+2))||0);if(t>=1&&t<=128){lib[t-1]={P:C.clonePerf(P),src:'dev',dirty:true};save();go({type:'detail',i:t-1})}};
 $('#clr').onclick=()=>{if(confirm('Remove all voices and reset this performance?')){const old=P;lib[i]={P:C.newPerformance('Init Perf',old),src:'dev',dirty:true};save();renderDetail()}};
 const body=$('#tabbody');
 if(tab==='fx'){body.append(fxTab(i));return}
 let v='<div class="bar"><button id="add" class="pri" '+(act.length>=16?'disabled':'')+'>＋ Add voice</button></div><div class="parts">';
 if(!act.length)v+='<div class="empty">No voices in this performance. Add one.</div>';
 act.forEach(k=>{const p=P.parts[k],vo=voiceOf(p);
  v+=`<div class="part" data-k="${k}"><div class="n">${k+1}</div><div><div class="vn">${esc(vo?vo.n:'Unknown voice '+p[1]+'/'+p[2]+'/'+(p[3]+1))}</div>
  <div class="vs">${vo?`${vo.m} › ${vo.s} · `:''}MSB ${p[1]} LSB ${p[2]} PC ${p[3]+1}</div>
  <div class="sl"><label>Vol <input type="range" data-f="14" min="0" max="127" value="${p[14]}"></label><label>Pan <input type="range" data-f="15" min="1" max="127" value="${p[15]}"></label>
  <label>Rev <input type="range" data-f="18" min="0" max="127" value="${p[18]}"></label><label>Cho <input type="range" data-f="19" min="0" max="127" value="${p[19]}"></label>
  <label>Note ≥ <input type="number" data-f="8" min="0" max="127" value="${p[8]}" title="${NOTE(p[8])}"></label><label>≤ <input type="number" data-f="9" min="0" max="127" value="${p[9]}" title="${NOTE(p[9])}"></label>
  <label>Shift <input type="number" data-f="22" min="40" max="88" value="${p[22]}" title="64 = 0"></label><label>Ch <input type="number" data-f="4" min="0" max="15" value="${p[4]}" title="0-based receive channel"></label></div></div>
  <div style="display:flex;gap:6px;flex-direction:column"><button class="edv">Edit voice</button><button class="chg">Change voice</button><button class="rm dng">Remove</button></div></div>`});

  el.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=()=>{P.parts[k][+inp.dataset.f]=+inp.value;touch(i)});
  el.querySelector('.rm').onclick=()=>{C.removeVoice(P,k);touch(i);renderDetail()};
  el.querySelector('.chg').onclick=()=>pick(v=>{C.setVoice(P.parts[k],v);touch(i);renderDetail()});
  el.querySelector('.edv').onclick=()=>{const vo=voiceOf(P.parts[k]);if(!vo)return alert('This voice is not in the Data List, so it cannot be loaded for editing.');
   openVoiceEditor(vo,{part:k,onSaved:nv=>{C.setVoice(P.parts[k],nv);touch(i);renderDetail()}})}});

  if(c[CO_MODE]===2&&act.length===1)P.parts[k][OFF.nlo]=c[0x42];touch(i);renderDetail()})}
function pick(cb){const d=$('#dlg'),q=$('#vq'),cat=$('#vc'),L=$('#vl');
 const draw=()=>{const s=q.value.toLowerCase(),m=cat.value;const r=DATA.voices.filter(v=>(!m||v.m===m)&&(!s||(v.n+' '+v.s+' '+v.m).toLowerCase().includes(s))).slice(0,300);
  L.innerHTML=r.map(v=>`<div data-k="${v.b}:${v.l}:${v.p}"><span class="c">${v.m} › ${esc(v.s)}</span><b>${esc(v.n)}</b><span style="margin-left:auto;color:var(--mute)">${v.b}/${v.l}/${v.p}</span><button class="ed" title="${out?'Open in the voice editor':'Connect MIDI to edit voices'}" ${(out||(v.b===63&&v.l===8&&vcache[v.p-1]))&&C.voiceAddr(v)?'':'disabled'}>Edit…</button></div>`).join('')||'<div>No matches</div>';
  L.querySelectorAll('div[data-k]').forEach(e=>{e.onclick=()=>{d.close();cb(vByKey.get(e.dataset.k))};
   e.querySelector('.ed').onclick=ev=>{ev.stopPropagation();d.close();openVoiceEditor(vByKey.get(e.dataset.k),{onSaved:cb})}})};
 const cur=cat.value;cat.innerHTML='<option value="">All categories</option>'+[...new Set(DATA.voices.map(v=>v.m))].map(m=>`<option>${m}</option>`).join('');cat.value=cur;
 const vu=$('#vu');vu.disabled=!out;vu.onclick=async()=>{await readUserNames(vu);cat.value='USER';draw()};
 q.oninput=draw;cat.onchange=draw;$('#vx').onclick=()=>d.close();draw();d.showModal();q.focus()}
// ---------- User voice slot chooser ----------
function pickUserSlot(newName,cb){const d=h('dialog',{style:'width:min(560px,95vw)'});let sel=null;
 const q=h('input',{placeholder:'Filter…',style:'flex:1'}),ref=h('button',{},'Refresh names'),x=h('button',{},'Cancel'),list=h('div',{class:'dl'}),info=h('div',{class:'hint',style:'padding:8px 12px'}),go1=h('button',{class:'pri',disabled:true},'Save here');
 const draw=()=>{const f=q.value.toLowerCase(),known=userVoices();list.innerHTML='';
  for(let nn=0;nn<128;nn++){const name=known[nn];const t=String(nn+1).padStart(3,'0')+' '+(name??'');if(f&&!t.toLowerCase().includes(f))continue;
   const r=h('div',{style:(sel===nn?'background:var(--panel2);outline:1px solid var(--acc);':'')},h('span',{class:'c',style:'width:44px'},String(nn+1).padStart(3,'0')),h('b',{style:name===undefined?'color:var(--mute);font-weight:400':''},name===undefined?'(name not read yet)':name||'(blank)'));
   r.onclick=()=>{sel=nn;go1.disabled=false;info.textContent=`"${newName}" will overwrite user voice ${nn+1}${name?' ("'+name+'")':''} on the keyboard.`;draw()};list.append(r)}};
 ref.disabled=!out;ref.onclick=async()=>{await readUserNames(ref);ref.textContent='Refresh names';draw()};
 x.onclick=()=>{d.close();d.remove()};go1.onclick=()=>{if(sel==null)return;if(!confirm('Overwrite user voice '+(sel+1)+' on the keyboard?'))return;const s2=sel;d.close();d.remove();cb(s2)};
 q.oninput=draw;d.append(h('div',{class:'dh'},h('b',{style:'align-self:center'},'Save as user voice'),q,ref,x),info,list,h('div',{class:'dh',style:'justify-content:flex-end;border-top:1px solid var(--line);border-bottom:0'},go1));
 document.body.append(d);info.textContent='Choose which user voice slot to overwrite.';draw();d.showModal()}
// ---------- Voice editor ----------
const GROUPS={eosc:n=>/^(AEG|Level|Half Damper|Element Level)/.test(n)?'Amplitude':/^(PEG|Pitch|Coarse|Fine|Random Pitch)/.test(n)?'Pitch':'Oscillator and key range',
 eflt:n=>/^FEG/.test(n)?'Filter envelope':/LFO/.test(n)?'Element LFO':'Filter',
 ctl:n=>/^Controller Set/.test(n)?'Controllers':/^User Wave/.test(n)?'User wave':'LFO',common:()=>'General',insA:()=>'Effect'};
let vcache={},vdirty=new Set(),vsaveT=null;
const b64=u=>{let t='';u.forEach(x=>t+=String.fromCharCode(x));return btoa(t)},unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
function saveVoices(){clearTimeout(vsaveT);vsaveT=setTimeout(()=>{try{localStorage.setItem('mxvoices',JSON.stringify({d:[...vdirty],v:Object.fromEntries(Object.entries(vcache).map(([nn,V])=>[nn,Object.fromEntries(Object.entries(V.blocks).map(([k,b])=>[k,b64(b)]))]))}))}catch(e){}},400)}
function loadVoices(){try{const o=JSON.parse(localStorage.getItem('mxvoices')||'null');if(o){vdirty=new Set(o.d);for(const nn in o.v)vcache[nn]={hdr:[0x0a,+nn],blocks:Object.fromEntries(Object.entries(o.v[nn]).map(([k,t])=>[k,unb64(t)]))}}}catch(e){}}
function cacheVoice(nn,V,dirty){vcache[nn]={hdr:[0x0a,nn],blocks:V.blocks};dirty?vdirty.add(nn):vdirty.delete(nn);saveVoices()}
function ensureUserSlots(){for(let nn=0;nn<128;nn++){const key='63:8:'+(nn+1);if(!vByKey.has(key)){const v={m:'USER',s:'User',n:'User '+String(nn+1).padStart(3,'0'),b:63,l:8,p:nn+1,y:'?'};DATA.voices.push(v);vByKey.set(key,v)}}}
async function readUserNames(btn){let ok=0;for(let nn=0;nn<128;nn++){btn.textContent=`Reading user voices ${nn+1}/128…`;
  try{const V=await requestVoice([0x0e,0x0a,nn]);if(!vdirty.has(nn)){cacheVoice(nn,V,false);registerUser(nn,C.voiceName(V)||'User '+String(nn+1).padStart(3,'0'))}ok++}catch(e){if(!ok&&nn>=2){btn.textContent='No response — check connection';return}}}
 btn.textContent=`Read ${ok}/128 — read again`}
function userVoices(){try{return JSON.parse(localStorage.getItem('mxuser')||'{}')}catch(e){return{}}}
function registerUser(nn,name){const u=userVoices();u[nn]=name;try{localStorage.setItem('mxuser',JSON.stringify(u))}catch(e){}
 const key='63:8:'+(nn+1);let v=vByKey.get(key);if(!v){v={m:'USER',s:'User',n:name,b:63,l:8,p:nn+1,y:'?'};DATA.voices.push(v);vByKey.set(key,v)}else v.n=name;return v}
async function openVoiceEditor(vo,ctx){
 const dlg=$('#ved'),addr=C.voiceAddr(vo);
 if(!addr){alert('Drum kits can\'t be edited here yet — only normal voices.');return}
 dlg.innerHTML='<div class="dh"><b>Loading '+esc(vo.n)+' from the keyboard…</b></div>';dlg.showModal();
 const slotNN=vo.b===63&&vo.l===8?vo.p-1:-1;let V;
 if(slotNN>=0&&vcache[slotNN]&&(vdirty.has(slotNN)||!out))V=C.cloneVoice(vcache[slotNN]);
 else try{V=await requestVoice(addr)}catch(e){if(slotNN>=0&&vcache[slotNN])V=C.cloneVoice(vcache[slotNN]);else{dlg.close();alert('The keyboard did not send the voice ('+e.message+'). Check the connection, Dev#, and that the MX is in performance or voice mode.');return}}
 if(!V.blocks[C.vkey(0x41,0)]){dlg.close();alert('Unexpected voice data received (is this a drum voice?).');return}
 const W=C.cloneVoice(V);let tab='common',dirty=false;const t=()=>{dirty=true};
 const nm=h('input',{maxlength:10,value:C.voiceName(W),style:'width:130px'});nm.oninput=()=>{C.setVoiceName(W,nm.value);t()};
 const tabsEl=h('div',{class:'tabs',style:'margin:0 12px'}),bodyEl=h('div',{class:'body'});
 const names=[['common','General'],['ctl','Controllers / LFO'],['ins','Insertion effect']].concat([...Array(8).keys()].map(e=>['e'+e,'Element '+(e+1)]));
 const elOn=e=>W.blocks[C.vkey(0x41,e)]&&W.blocks[C.vkey(0x41,e)][0]===1;
 const drawTabs=()=>{tabsEl.innerHTML='';names.forEach(([k,n])=>{const b=h('button',{class:(tab===k?'on ':'')+(k[0]==='e'&&!elOn(+k.slice(1))?'off':'')},n);b.onclick=()=>{tab=k;drawTabs();drawBody()};tabsEl.append(b)})};
 const groupRows=(key,blk,specs)=>{const m=new Map();specs.forEach(sp=>{const g=(GROUPS[key]||(()=>'Parameters'))(sp.n);if(!m.has(g))m.set(g,[]);m.get(g).push(specRow(blk,sp,t))});
  return [...m].map(([g,r],k)=>sec(g,simpleGrid(r),k<2))};
 const drawBody=()=>{bodyEl.innerHTML='';
  if(tab==='common'){const b=W.blocks[C.vkey(0x40,0)];bodyEl.append(...groupRows('common',b,VSPEC.common),h('div',{class:'hint',style:'padding:0'},'Elements are the building blocks of a voice: each has its own wave, envelopes and filter. Disabled elements are dimmed in the tab bar.'))}
  else if(tab==='ctl'){const b=W.blocks[C.vkey(0x40,6)];bodyEl.append(...groupRows('ctl',b,VSPEC.ctl))}
  else if(tab==='ins'){const b=W.blocks[C.vkey(0x40,3)];bodyEl.append(sec('Insertion effect A',h('div',{},fxPanel(b,'ins',t)),true),h('div',{class:'hint',style:'padding:0'},'Each element chooses whether it goes through this effect (Insertion Effect switch on the element).'))}
  else{const e=+tab.slice(1),a=W.blocks[C.vkey(0x41,e)],f=W.blocks[C.vkey(0x42,e)];
   if(!a||!f){bodyEl.append(h('div',{class:'empty'},'This element was not included in the dump.'));return}
   const g1=groupRows('eosc',a,VSPEC.eosc),g2=groupRows('eflt',f,VSPEC.eflt);bodyEl.append(...g1,...g2)}};
 const msgEl=h('span',{class:'hint',style:'padding:0 12px'},'');
 const tryBtn=h('button',{},ctx.part!=null?`Try on part ${ctx.part+1}`:'Try (voice edit buffer)');
 tryBtn.onclick=async()=>{try{const tgt=ctx.part!=null?[0x0e,0x30,ctx.part]:[0x0e,0x0f,0];for(const m of C.buildVoice(dev(),W,tgt)){send(m);await sleep(12)}
   msgEl.textContent=ctx.part!=null?'Sent to part '+(ctx.part+1)+' of the current edit-buffer performance. Audition the performance first if you hear no change.':'Sent to the voice edit buffer. Switch the keyboard to voice mode to hear it.'}catch(e){msgEl.textContent=e.message}};
 const saveBtn=h('button',{class:'pri'},'Save as user voice…');
 saveBtn.onclick=()=>pickUserSlot(C.voiceName(W),async slot=>{try{for(const m of C.buildVoice(dev(),W,[0x0e,0x0a,slot]))send(m),await sleep(15)}catch(e){msgEl.textContent=e.message;return}
  cacheVoice(slot,W,false);const nv=registerUser(slot,C.voiceName(W));dlg.close();if(ctx.onSaved)ctx.onSaved(nv);else status('Saved user voice '+(slot+1)+' "'+nv.n+'"')});
 const closeBtn=h('button',{},'Close');closeBtn.onclick=()=>{if(!dirty||confirm('Discard your edits to this voice?'))dlg.close()};
 dlg.innerHTML='';dlg.append(h('div',{class:'dh'},h('b',{style:'align-self:center'},vo.n+' › '),nm,h('span',{style:'flex:1'}),tryBtn,saveBtn,closeBtn),tabsEl,msgEl,bodyEl);
 drawTabs();drawBody()}

  h('div',{class:'dh',style:'justify-content:flex-end;border-top:1px solid var(--line);border-bottom:0'},x));
